   canvas-dot for the map. A base (data-base: neutral, stone, zinc, slate) sets the neutrals; an accent (data-destaque)

   Depth comes from 1 px hairlines in the border color and from shadows on floating surfaces only. */

    --in: #2563eb; --out: #ea580c; --in-t: #2563eb; --out-t: #c2490a;

  --sombra: 0 4px 6px -1px rgb(0 0 0 / 0.10), 0 2px 4px -2px rgb(0 0 0 / 0.10);
  --body: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "Geist Mono", ui-monospace, SFMono-Regular, Consolas, monospace;

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--canvas); color: var(--foreground); font-family: var(--body); font-size: 14px; line-height: 1.4; overflow: hidden; }
h2 { font-size: 17px; font-weight: 600; line-height: 1.2; letter-spacing: -0.01em; margin: 0; }
h3 { font-size: 13px; font-weight: 600; letter-spacing: -0.01em; margin: 0; }
p { margin: 0; }
a { color: var(--primary-text); text-underline-offset: 3px; }
i { font-style: normal; }
.small { font-size: 12px; color: var(--muted-foreground); }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; font-weight: 500; }
:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
img.ic { display: inline-block; flex: none; width: 20px; height: 20px; object-fit: contain; vertical-align: middle; }
.sw { display: inline-block; flex: none; width: 10px; height: 10px; border-radius: 3px; background: var(--cat, var(--muted-foreground)); }

.app { height: 100%; display: flex; flex-direction: column; position: relative; }

/* top bar: one line, never wraps */
.top { flex: none; display: flex; flex-wrap: nowrap; align-items: center; gap: 4px; padding: 8px 12px; background: var(--card); border-bottom: 1px solid var(--border); position: relative; z-index: 6; }
.brand { font-weight: 600; font-size: 14px; letter-spacing: -0.01em; white-space: nowrap; display: none; }
@media (min-width: 1180px) { .brand { display: block; margin-right: 10px; } }
/* ghost button: text only; the accent fill appears under the mouse */
.tx { background: none; border: 0; border-radius: 8px; height: 36px; padding: 0 10px; white-space: nowrap; flex: none; color: var(--foreground); }
.tx { display: inline-flex; align-items: center; gap: 7px; position: relative; }
.tx:hover, .top .tx[aria-expanded="true"] { background: var(--accent); }
/* icons in the Lucide style: 16 px, 1.75 stroke, current color */
.ico { flex: none; width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.ico.cheio { fill: currentColor; }
.icw { position: relative; display: inline-flex; }
/* a small dot in primary: this control is away from its default, so the graph is restricted */

      passos: [[1, t('step1'), '1', t('step1')], [2, t('step_n', { n: 2 }), '2', '2'], [3, t('step_n', { n: 3 }), '3', '3'], [0, t('step_all'), '∞', t('step_all')]].map(duplo('d', passos)).join(''),
      iso: '<button type="button" class="btn" data-iso="1" aria-pressed="' + isolado + '" aria-label="' + esc(t(isolado ? 'show_all' : 'isolate')) + '" data-tip="' + esc(t(isolado ? 'show_all' : 'isolate')) + '"><span class="lgo">' + t(isolado ? 'show_all' : 'isolate') + '</span><span class="cto">' + svgIco('scan') + '</span></button>'
    };
    document.querySelectorAll('[data-host]').forEach(function (el) { el.innerHTML = hosts[el.getAttribute('data-host')]; });
    var dif = difere();
    // one pattern for every trigger: [icon] [text] [caret]; the name of the control goes in the accessible label and in the tip
    var vMet = dif ? t('custom') : t('sc_' + atalho);
    $('bmetodos').innerHTML = ico('layers', dif || atalho !== 'tudo') + '<span class="rt">' + vMet + '</span>' + CARET;
    $('bmetodos').setAttribute('aria-label', t('a_methods', { v: vMet })); $('bmetodos').title = t('a_methods', { v: vMet });
    $('atalhos').innerHTML = ATALHOS.map(function (a) {
      return '<button type="button" class="atalho" role="menuitemradio" data-atalho="' + a + '" aria-checked="' + (a === atalho && !dif) + '"><b>' + t('sc_' + a) + '</b>' + (a === atalho && dif ? '<span class="small">' + t('sc_last') + '</span>' : '') + '<span class="small">' + t('sc_' + a + '_d') + '</span></button>';
    }).join('');
    $('chip').hidden = !foco;
    if (foco) $('chipnome').textContent = nomeNo(foco);
    $('gerais').checked = gerais;
    var nOc = D.cats.filter(function (c) { return ocultas.has(c); }).length;
    // filter count = how many things differ from the default: categories, general inputs, buildings removed by hand
    var nF = filtrosAtivos();
    $('bfiltros').innerHTML = ico('funnel', false, nF > 0) + '<span class="rt">' + t('filters') + '</span>' + (nF ? '<span class="selo">' + (nF > 99 ? '99+' : nF) + '</span>' : '') + CARET;
    var aF = nF ? t('a_filters', { n: nF }) : t('filters');
    $('bfiltros').setAttribute('aria-label', aF); $('bfiltros').title = aF;
    $('fvis').textContent = t('f_vis', { a: D.cats.length - nOc, b: D.cats.length });
    $('frest').innerHTML = nF ? '<button type="button" class="lk" data-restaura="1">' + t('f_reset') + '</button>' : '';
    $('cats').innerHTML = D.cats.map(function (c, i) {
      var n = D.blds.filter(function (b) { return b.cat === c; }).length;
      return '<label class="check" for="cat-' + i + '"><input type="checkbox" id="cat-' + i + '" data-c="' + i + '"' + (ocultas.has(c) ? '' : ' checked') + '><i class="sw" style="--cat:' + corCat(c) + '"></i><span>' + esc(nomeCat(c)) + '</span><span class="ct">' + n + '</span></label>';
    }).join('');
    $('bera').innerHTML = ico('hourglass', era !== ERA_PADRAO) + '<span class="rt">' + esc(tEra) + '</span>' + CARET;
    $('bera').setAttribute('aria-label', t('a_era', { v: tEra })); $('bera').title = t('a_era', { v: tEra });
    $('bidioma').innerHTML = ico('globe') + '<span class="rt">' + esc(nomeL) + '</span>' + CARET;
    $('bidioma').setAttribute('aria-label', t('a_lang', { v: nomeL })); $('bidioma').title = t('a_lang', { v: nomeL });
    POPS.forEach(function (x) { $(x[1]).setAttribute('aria-haspopup', 'menu'); });
    $('legcats').innerHTML = D.cats.filter(function (c) { return !ocultas.has(c); }).map(function (c) { return '<span><i class="sw" style="--cat:' + corCat(c) + '"></i>' + esc(nomeCat(c)) + '</span>'; }).join('');
  }
  // redraws everything; "ajustar" reframes the camera (what is on screen changed), otherwise it stays where it was
  function tudo(ajustar) {
    // the sheet and the chain strip are built before drawing, so the camera knows how much room is left
    painel(); botoes(); // the sheet first: it holds the chain controls that botoes() fills in
    desenha(ajustar);
    poeStatus();
    escondeTip();
    salva();
  }
  // only the highlight changed (pin, release, direction, reach): nothing is redrawn or hidden
  function soRealce() {
    painel(); botoes(); // the sheet first: it holds the chain controls that botoes() fills in
    pintaRealce();
    poeStatus();
    if (foco) enquadra();
    escondeTip();
  }
  function vaiPara(id) {
    var refaz = isolado;
    if (id && id[0] === 'b' && ocultas.has(B[id.slice(2)].cat)) { ocultas.delete(B[id.slice(2)].cat); refaz = true; }
    if (!id) isolado = false;
    foco = id; if (id) recolhida = false;
    // a node that is not in the drawing (building removed from the graph, good without links) has to come in: then redraw
    if (refaz || !LAY || (id && !LAY.N[id])) { tudo(true); if (foco && !isolado) soRealce(); }
    else soRealce();
  }
  // what is ticked changed: redo the sums and the drawing, keeping the camera and the sheet scroll
  function remarcou(idFoco) {
    var corpo = sheet.querySelector('.sh-body'), rol = corpo ? corpo.scrollTop : 0;
    recalcula(); tudo(false);
    corpo = sheet.querySelector('.sh-body'); if (corpo) corpo.scrollTop = rol;
    var again = idFoco && document.getElementById(idFoco); if (again) again.focus();
  }

  var POPS = [['pmetodos', 'bmetodos'], ['pera', 'bera'], ['pfiltros', 'bfiltros'], ['ptema', 'btema'], ['pidioma', 'bidioma'], ['pajuda', 'bajuda']];
  var popAtual = null;
  // opens one menu (closing any other) 4 px under its trigger, left edges aligned; on the right side of the bar the
  // right edges are aligned instead, so the menu never leaves the window. "focar" moves the focus into the menu.
  function abrePop(qual, focar) {
    popAtual = null;
    POPS.forEach(function (x) {
      var p = $(x[0]), bt = $(x[1]);
      p.hidden = x[0] !== qual; bt.setAttribute('aria-expanded', String(x[0] === qual));
      if (p.hidden) return;
      popAtual = x;
      var app = $('app').getBoundingClientRect(), r = bt.getBoundingClientRect(), topo = Math.round(r.bottom - app.top + 4);
      p.style.top = topo + 'px'; p.style.right = 'auto'; p.style.maxHeight = Math.max(120, app.height - topo - 8) + 'px';
      var esq = r.left - app.left;
      if (esq + p.offsetWidth > app.width - 8) esq = r.right - app.left - p.offsetWidth;
      p.style.left = Math.max(8, Math.min(esq, app.width - p.offsetWidth - 8)) + 'px';
      if (focar) { var it = itensPop(p); (it.filter(function (e) { return e.getAttribute('aria-checked') === 'true'; })[0] || it[0] || p).focus(); }
    });
  }
  var itensPop = function (p) { return [].filter.call(p.querySelectorAll('button, input, a[href]'), function (e) { return e.getClientRects().length; }); };
  // closes the open menu and gives the focus back to its trigger
  function fechaPop() { var x = popAtual; abrePop(null); if (x) $(x[1]).focus(); }
  var popAberto = function () { return POPS.some(function (x) { return !$(x[0]).hidden; }); };

  document.addEventListener('click', function (ev) {
    var b;
    if ((b = ev.target.closest('button[data-atalho]'))) { aplicaAtalho(b.getAttribute('data-atalho')); recalcula(); fechaPop(); tudo(true); if (foco && !isolado) soRealce(); return; }
    if ((b = ev.target.closest('button[data-lingua]'))) { fechaPop(); trocaLingua(b.getAttribute('data-lingua')); return; }
    if ((b = ev.target.closest('button[data-v]'))) { dir = b.getAttribute('data-v'); if (isolado) tudo(true); else { soRealce(); salva(); } return; }
    if ((b = ev.target.closest('button[data-d]'))) { passos = Number(b.getAttribute('data-d')); if (isolado) tudo(true); else { soRealce(); salva(); } return; }
    if ((b = ev.target.closest('button[data-base-op]'))) { base = b.getAttribute('data-base-op'); aplicaPele(); botoes(); salva(); return; }
    if ((b = ev.target.closest('button[data-dest-op]'))) { destaque = b.getAttribute('data-dest-op'); aplicaPele(); botoes(); salva(); return; }
    if ((b = ev.target.closest('button[data-modo]'))) { modo = b.getAttribute('data-modo'); aplicaPele(); botoes(); salva(); return; }
    if (ev.target.closest('[data-restaura]')) { ocultas = new Set(D.ocultas); gerais = false; fora = new Set(); recalcula(); tudo(true); if (foco && !isolado) soRealce(); abrePop('pfiltros'); return; }
    if ((b = ev.target.closest('button[data-era]'))) { fechaPop(); poeEra(b.getAttribute('data-era')); return; }
    if (ev.target.closest('[data-iso]')) { isolado = !isolado; tudo(true); if (!isolado) soRealce(); return; }
    if ((b = ev.target.closest('button[data-acao]'))) {
      var bd = B[b.getAttribute('data-b')], ac = b.getAttribute('data-acao'), gq = b.getAttribute('data-g');
      // same rule as the global shortcuts: "all" ticks everything; "basic" and "late game" tick one method per group
      var esc2 = ac === 'todos' ? null : escolhe(bd, ac);
      bd.gr.forEach(function (g, gi) {
        if (gq !== null && Number(gq) !== gi) return;
        g.ms.forEach(function (m, mi) { M[bd.id][gi][mi] = !esc2 || mi === esc2[gi]; });
      });
      remarcou(null); return;
    }
    if ((b = ev.target.closest('[data-incl]'))) { var bi = b.getAttribute('data-incl'); if (fora.has(bi)) fora.delete(bi); else fora.add(bi); remarcou('olho'); return; }
    if ((b = ev.target.closest('[data-go]'))) { busca.value = ''; res.hidden = true; vaiPara(b.getAttribute('data-go')); return; }
    if (ev.target.closest('[data-limpa]') || ev.target.closest('#chip')) { vaiPara(null); return; }
    if (ev.target.closest('#recolher')) { recolhida = !recolhida; painel(); botoes(); poeStatus(); reajusta(); return; }
    // popovers: opened by their button, closed by clicking outside
    var qual = null;
    POPS.forEach(function (x) { if (ev.target.closest('#' + x[1])) qual = x[0]; });
    if (qual) { abrePop($(qual).hidden ? qual : null); return; }
    if (!ev.target.closest('.pop')) abrePop(null);
    if (!ev.target.closest('.search')) res.hidden = true;
  });
  function poeEra(e) { era = e === 'save' ? 'save' : Number(e); recalcula(); tudo(false); if (foco && !isolado) soRealce(); }
  function trocaLingua(c, porHash) {
    if (c === lingua || !temLingua(c)) return;
    poeLingua(c);
    if (!porHash) { try { history.replaceState(null, '', '#' + c); } catch (e) { /* some frames forbid it */ } }
    tudo(true); if (foco && !isolado) soRealce();
  }
  document.addEventListener('change', function (ev) {
    var x = ev.target, i;
    if (x.id === 'gerais') { gerais = x.checked; tudo(true); if (foco && !isolado) soRealce(); return; }
    if ((i = x.getAttribute('data-c')) !== null && x.closest('#cats')) {
      var c = D.cats[Number(i)];
      if (x.checked) ocultas.delete(c); else ocultas.add(c);
      tudo(true); if (foco && !isolado) soRealce();
      var again = $('cat-' + i); if (again) again.focus();
      return;
    }
    if (x.getAttribute('data-m') !== null && x.closest('#sheet')) {
      M[x.getAttribute('data-b')][Number(x.getAttribute('data-g'))][Number(x.getAttribute('data-m'))] = x.checked;
      remarcou(x.id);
    }
  });
  window.addEventListener('hashchange', function () { trocaLingua((location.hash || '').replace('#', '').toLowerCase(), true); });
  $('zmenos').addEventListener('click', function () { zoomCentro(1 / 1.3); });
  $('zmais').addEventListener('click', function () { zoomCentro(1.3); });
  $('zfit').addEventListener('click', ajusta);

  // tips inside the sheet: the same tip box as the nodes, with the mouse or with keyboard focus (and touch, which focuses the button)
  function dicaDe(el) {
    var r = stage.getBoundingClientRect(), e = el.getBoundingClientRect();
    tip.textContent = el.getAttribute('data-tip'); tip.hidden = false;
    tip.style.left = entre(e.left - r.left, 4, Math.max(4, r.width - tip.offsetWidth - 4)) + 'px';
    tip.style.top = Math.max(4, e.top - r.top - tip.offsetHeight - 6) + 'px';
  }
  var comDica = function (ev) { var el = ev.target.closest('[data-tip]'); if (el) dicaDe(el); else escondeTip(); };
  sheet.addEventListener('mouseover', comDica);
  sheet.addEventListener('focusin', comDica);
  sheet.addEventListener('mouseleave', escondeTip);
  sheet.addEventListener('focusout', escondeTip);

  // search: by the name in the active language, and also by the English name
  var busca = $('busca'), res = $('resultados'), itens = null;
  function procura() {
    if (!itens) {
      var en = D.termos.en;
      itens = D.goods.map(function (g) { return { id: 'g:' + g.id, n: nomeG(g.id), k: t('k_good'), s: norm(nomeG(g.id)) + '|' + norm(en['g:' + g.id] || '') }; })
        .concat(D.blds.map(function (b) { return { id: 'b:' + b.id, n: N(b.id), k: nomeCat(b.cat), s: norm(N(b.id)) + '|' + norm(en[b.id] || '') }; }));
    }
    var q = norm(busca.value.trim());
    if (!q) { res.hidden = true; res.innerHTML = ''; return []; }
    var ac = itens.filter(function (x) { return x.s.indexOf(q) >= 0; }).sort(function (a, b) { return (a.s.indexOf(q) ? 1 : 0) - (b.s.indexOf(q) ? 1 : 0); }).slice(0, 14);
    res.innerHTML = ac.length ? ac.map(function (x) { return '<button type="button" data-go="' + x.id + '">' + img(x.id) + '<span class="nm">' + esc(x.n) + '</span><span class="k">' + esc(x.k) + '</span></button>'; }).join('') : '<div class="none">' + t('search_none') + '</div>';
    res.hidden = false;
    return ac;
  }
  busca.addEventListener('input', procura);
  busca.addEventListener('focus', procura);
  busca.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape') { res.hidden = true; busca.blur(); ev.stopPropagation(); return; }
    if (ev.key === 'ArrowDown') { var p = res.querySelector('button'); if (p) { ev.preventDefault(); p.focus(); } return; }
    if (ev.key !== 'Enter') return;
    var ac = procura(); if (ac.length) { busca.value = ''; res.hidden = true; busca.blur(); vaiPara(ac[0].id); }
  });
  res.addEventListener('keydown', function (ev) {
    if (ev.key !== 'ArrowDown' && ev.key !== 'ArrowUp') return;
    ev.preventDefault();
    var alvo = ev.key === 'ArrowDown' ? ev.target.nextElementSibling : ev.target.previousElementSibling;
    (alvo || busca).focus();
  });

  // where the focus came from: a pointer press marks it, the next key clears it (the map only shows a ring for the keyboard)
  document.addEventListener('pointerdown', function () { document.documentElement.setAttribute('data-foco-ponteiro', ''); }, true);
  document.addEventListener('keydown', function () { document.documentElement.removeAttribute('data-foco-ponteiro'); }, true);
  // menus: arrow down (or Enter / space, which click) opens from the trigger; arrows, Home and End walk the items; Esc closes
  document.addEventListener('keydown', function (ev) {
    if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
    var gat = null;
    POPS.forEach(function (x) { if (ev.target.id === x[1]) gat = x; });
    if (gat && (ev.key === 'ArrowDown' || ev.key === 'Enter' || ev.key === ' ')) { ev.preventDefault(); abrePop(gat[0], true); return; }
    if (!popAtual) return;
    var p = $(popAtual[0]);
    if (!p.contains(ev.target)) return;
    var it = itensPop(p), i = it.indexOf(ev.target), n = null;
    if (ev.key === 'ArrowDown') n = it[(i + 1) % it.length];
    else if (ev.key === 'ArrowUp') n = it[(i - 1 + it.length) % it.length];
    else if (ev.key === 'Home') n = it[0];
    else if (ev.key === 'End') n = it[it.length - 1];
    if (n) { ev.preventDefault(); n.focus(); }
  });
  // the map itself, focused from the keyboard: arrows move it
  svg.addEventListener('keydown', function (ev) {
    if (ev.target !== svg) return;
    var d = { ArrowLeft: [60, 0], ArrowRight: [-60, 0], ArrowUp: [0, 60], ArrowDown: [0, -60] }[ev.key];
    if (!d) return;
    ev.preventDefault(); camManual = true; view.x += d[0]; view.y += d[1]; aplicaView();
  });

  // keyboard shortcuts
  document.addEventListener('keydown', function (ev) {
    if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
    var x = ev.target, digitando = x && (x.tagName === 'INPUT' && x.type !== 'checkbox' || x.tagName === 'SELECT' || x.tagName === 'TEXTAREA');
    if (ev.key === 'Escape') {
      if (popAberto()) { fechaPop(); return; }
      if (digitando) { x.blur(); return; }
      if (foco) vaiPara(null);
      return;
    }
    if (digitando) return;
    if (ev.key === '/') { ev.preventDefault(); busca.focus(); }
    else if (ev.key === '0') ajusta();
    else if (ev.key === '+' || ev.key === '=') zoomCentro(1.3);
    else if (ev.key === '-' || ev.key === '−') zoomCentro(1 / 1.3);
  });

  // The map area changes size (window resized, phone rotated, the chain strip appearing). While the camera was not
  // moved by hand, fit again; if it was, keep the zoom and keep the same point of the graph at the center.
  // The sheet lives inside the map area and does not resize it, so fitting can never feed back into this observer.
  var tam = { w: stage.clientWidth, h: stage.clientHeight }, tRes = null;
  function reajusta() { if (!camManual) { ajusta(); if (foco && !isolado) enquadra(); } }
  function mudouTamanho() {
    var w = stage.clientWidth, h = stage.clientHeight;
    if (!w || !h || (w === tam.w && h === tam.h)) return;
    aplicaAltura();
    if (camManual) {
      view.x += (w - tam.w) / 2; view.y += (h - tam.h) / 2;
      aplicaView();
    } else { ajusta(); if (foco && !isolado) enquadra(); }
    tam = { w: w, h: h };
  }
  var agenda = function () { clearTimeout(tRes); tRes = setTimeout(mudouTamanho, 120); };
  if (window.ResizeObserver) new ResizeObserver(agenda).observe(stage);
  window.addEventListener('resize', agenda); // also covers browsers that deliver the observer late
  window.addEventListener('orientationchange', agenda);

  carrega();
  aplicaPele();
  poeLingua(linguaInicial());
  recalcula();
  tudo(true);
  tam = { w: stage.clientWidth, h: stage.clientHeight };
})();
</script>
