html, body { height: 100%; }
body { background: var(--canvas); color: var(--foreground); font-family: var(--body); font-size: 14px; line-height: 1.4; overflow: hidden; }
h2 { font-size: 17px; font-weight: 600; line-height: 1.2; letter-spacing: -0.01em; margin: 0; }
h3 { font-size: 13px; font-weight: 600; letter-spacing: -0.01em; margin: 0; }
p { margin: 0; }
a { color: var(--primary-text); text-underline-offset: 3px; }
i { font-style: normal; }
.small { font-size: 12px; color: var(--muted-foreground); }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; font-weight: 500; }
:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
img.ic { display: inline-block; flex: none; width: 20px; height: 20px; object-fit: contain; vertical-align: middle; }
.sw { display: inline-block; flex: none; width: 10px; height: 10px; border-radius: 3px; background: var(--cat, var(--muted-foreground)); }

.app { height: 100%; display: flex; flex-direction: column; position: relative; }

/* top bar: one line, never wraps */
.top { flex: none; display: flex; flex-wrap: nowrap; align-items: center; gap: 4px; padding: 8px 12px; background: var(--card); border-bottom: 1px solid var(--border); position: relative; z-index: 6; }
.brand { font-weight: 600; font-size: 14px; letter-spacing: -0.01em; white-space: nowrap; display: none; }
@media (min-width: 1180px) { .brand { display: block; margin-right: 10px; } }
/* ghost button: text only; the accent fill appears under the mouse */
.tx { background: none; border: 0; border-radius: 8px; height: 36px; padding: 0 10px; white-space: nowrap; flex: none; color: var(--foreground); }
.tx { display: inline-flex; align-items: center; gap: 7px; position: relative; }
.tx:hover, .top .tx[aria-expanded="true"] { background: var(--accent); }
/* icons in the Lucide style: 16 px, 1.75 stroke, current color */
.ico { flex: none; width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.ico.filled { fill: currentColor; }
.icw { position: relative; display: inline-flex; }
/* a small dot in primary: this control is away from its default, so the graph is restricted */
.dot-primary { position: absolute; top: -3px; right: -4px; width: 7px; height: 7px; border-radius: 50%; background: var(--primary); }
/* count of applied filters */
.badge { display: inline-flex; align-items: center; justify-content: center; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 6px; background: var(--primary); color: var(--primary-foreground); font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums; }
.ico.tri { width: 12px; height: 12px; color: var(--muted-foreground); }
.tx.sq { width: 32px; height: 32px; padding: 0; display: inline-flex; align-items: center; justify-content: center; }
/* outline button: hairline in the border color over the background */
.btn { background: var(--background); border: 1px solid var(--border); border-radius: 8px; height: 30px; padding: 0 10px; white-space: nowrap; flex: none; color: var(--foreground); }
.btn:hover { background: var(--accent); }
/* segmented control: a hairline group; the active item is filled with primary */
.seg { display: inline-flex; flex-wrap: nowrap; flex: none; gap: 2px; padding: 2px; border: 1px solid var(--border); border-radius: 8px; background: var(--background); }
.seg button { background: none; border: 0; border-radius: 6px; height: 26px; padding: 0 9px; white-space: nowrap; color: var(--muted-foreground); }
.seg button:hover { background: var(--accent); color: var(--foreground); }
.seg button[aria-pressed="true"] { background: var(--primary); color: var(--primary-foreground); }
/* text action */
.lk { background: none; border: 0; padding: 0; color: var(--primary-text); font-size: 12px; font-weight: 500; text-decoration: none; }
.lk:hover { text-decoration: underline; text-underline-offset: 3px; }
.lks { display: inline-flex; align-items: baseline; gap: 6px; white-space: nowrap; }
.lks .sep { color: var(--muted-foreground); font-size: 12px; }
.spacer { flex: 1 1 0; min-width: 0; }
.search { position: relative; flex: 1 1 200px; min-width: 84px; max-width: 280px; margin-right: 6px; }
.search input { width: 100%; height: 36px; background: var(--background); border: 1px solid var(--input); border-radius: 8px; padding: 0 10px; }
.search input::placeholder { color: var(--muted-foreground); }
.results { position: absolute; z-index: 9; left: 0; top: 100%; margin-top: 6px; width: max(100%, 300px); max-width: calc(100vw - 20px); background: var(--popover); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow); max-height: 60vh; overflow-y: auto; display: flex; flex-direction: column; padding: 4px; }
.results button { background: none; border: 0; border-radius: 6px; text-align: left; padding: 6px 8px; display: flex; align-items: center; gap: 8px; font-weight: 400; }
.results button:hover, .results button:focus-visible { background: var(--accent); }
.results .nm { flex: 1 1 0; min-width: 0; }
.results .k { color: var(--muted-foreground); font-size: 12px; white-space: nowrap; }
.results .none { padding: 8px; color: var(--muted-foreground); }
.chip { display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--secondary); min-width: 0; max-width: 240px; flex: 0 1 auto; margin-left: 4px; }
.chip .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.chip .x { color: var(--muted-foreground); width: 14px; height: 14px; }
/* when the text no longer fits, every trigger keeps only its icon; only below 520 px do Era and Language leave the bar */
@media (max-width: 899px) {
  .top .rt, .top .tx .tri { display: none; }
  .top .tx { width: 36px; padding: 0; justify-content: center; }
  .top .tx .badge { position: absolute; top: 1px; right: 0; min-width: 15px; height: 15px; padding: 0 3px; font-size: 10px; }
}
@media (max-width: 519px) { .top .wide-only { display: none; } }
@media (min-width: 520px) { .pop .sec.only-narrow { display: none; } }
@media (max-width: 759px) { .chip { max-width: 104px; } .top { padding-inline: 8px; } }

/* chain controls live inside the sheet header, on the right, before collapse and close: one line, always visible
   (also with the sheet collapsed). As the width shrinks: short labels (icons) on the controls, then the technology tag
   goes, then the category keeps only its square, and under 700 px the controls wrap to a second line of the header. */
.cbar { display: flex; flex: none; align-items: center; gap: 8px; margin-right: 6px; padding-right: 12px; border-right: 1px solid var(--border); }
.cbar .seg button { height: 22px; padding: 0 8px; display: inline-flex; align-items: center; }
.cbar .btn { height: 28px; display: inline-flex; align-items: center; gap: 6px; }
.cbar .long { display: inline-flex; align-items: center; gap: 5px; }
/* reach: closer / value / further, then whole chain */
.stp { display: inline-flex; align-items: center; gap: 1px; }
.stp .tx.sq { width: 28px; height: 28px; }
.stp .tx.sq:disabled { opacity: 0.35; cursor: default; background: none; }
.stp .tx.sq[aria-pressed="true"] { background: var(--primary); color: var(--primary-foreground); }
.stp .sv { display: inline-flex; justify-content: center; min-width: 92px; font-weight: 500; font-variant-numeric: tabular-nums; white-space: nowrap; }
.stp [data-step="toggle"] { margin-left: 3px; }
.cbar .short { display: none; }
/* direction cue: the arrow takes the color of what goes in (upstream) or comes out (downstream); the label keeps the color of the control.
   On the active segment the fill is primary, so the arrow uses the shade of the same hue that holds 3:1 on it */
.cbar .ico.d-in, .cbar .ico .s-in { stroke: var(--in-t); }
.cbar .ico.d-out, .cbar .ico .s-out { stroke: var(--out-t); }
.cbar [aria-pressed="true"] .ico.d-in, .cbar [aria-pressed="true"] .ico .s-in { stroke: var(--in-on); }
.cbar [aria-pressed="true"] .ico.d-out, .cbar [aria-pressed="true"] .ico .s-out { stroke: var(--out-on); }
.cbar .seg .ico { stroke-width: 2; }
/* small swatch that repeats the cue next to a heading */
.dk { display: inline-block; flex: none; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }
.dk.in { background: var(--in); }
.dk.out { background: var(--out); }
.cbar .ico { width: 15px; height: 15px; }
@media (max-width: 1399px) { .cbar .long { display: none; } .cbar .short { display: inline-flex; } .stp .sv { min-width: 24px; } }
@media (max-width: 1249px) { .sh-head .ttl > .tec { display: none; } }
@media (max-width: 1099px) { .sh-head .cat .ctx { display: none; } }
@media (max-width: 699px) {
  .sheet.pinned .sh-head { flex-wrap: wrap; }
  .sheet.pinned .sh-head .ttl { flex: 1 1 60%; }
  .sheet.pinned .sh-head .cbar { order: 5; flex: 1 1 100%; flex-wrap: wrap; margin: 0; padding: 6px 0 0; border-right: 0; }
}
.sheet.collapsed .sh-head { padding-top: 10px; padding-bottom: 10px; }

/* menus */
.pop { position: absolute; z-index: 8; top: 54px; right: 8px; width: min(390px, calc(100% - 16px)); max-height: calc(100% - 66px); overflow-y: auto; background: var(--popover); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow); padding: 14px; display: flex; flex-direction: column; gap: 14px; font-size: 13px; }
.pop .sec { display: flex; flex-direction: column; gap: 6px; }
.pop#menu-methods { gap: 8px; }
.pop#menu-methods .sec { gap: 4px; }
.catlist { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 10px; }
@media (max-width: 420px) { .catlist { grid-template-columns: 1fr; } }
.check { display: flex; align-items: center; gap: 8px; cursor: pointer; min-width: 0; padding: 4px 6px; border-radius: 6px; }
.check:hover { background: var(--accent); }
input[type="checkbox"] { appearance: none; -webkit-appearance: none; width: 16px; height: 16px; margin: 0; flex: none; border: 1px solid var(--input); border-radius: 4px; background: var(--background); cursor: pointer; }
input[type="checkbox"]:checked { border-color: var(--primary); background: var(--primary) var(--check) center / 12px 12px no-repeat; }
.check .ct { color: var(--muted-foreground); font-size: 12px; margin-left: auto; font-family: var(--mono); font-variant-numeric: tabular-nums; }
.keys { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 5px 12px; align-items: baseline; margin: 0; }
.keys dt { white-space: nowrap; }
.keys dd { margin: 0; color: var(--muted-foreground); }
.pop ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; }
kbd { font-family: var(--mono); font-size: 12px; border: 1px solid var(--border); border-radius: 4px; padding: 0 5px; background: var(--muted); }
/* a list of choices: the selected one carries a check mark in primary */
.shortcuts, .ops { display: flex; flex-direction: column; gap: 2px; }
.shortcut, .op { text-align: left; background: none; border: 0; border-radius: 6px; padding: 8px; display: grid; grid-template-columns: 16px minmax(0, 1fr); column-gap: 8px; align-items: start; font-weight: 400; }
.shortcut::before, .op::before { content: ""; width: 15px; height: 15px; margin-top: 2px; background: transparent; -webkit-mask: var(--tick) center / contain no-repeat; mask: var(--tick) center / contain no-repeat; }
.shortcut[aria-checked="true"]::before, .op[aria-checked="true"]::before { background: var(--primary-text); }
.op::before { margin-top: 0; }
.pop.list { width: min(260px, calc(100% - 16px)); padding: 6px; gap: 4px; }
.pop.list .small { padding: 4px 8px 6px; }
.shortcut > *, .op > * { grid-column: 2; }
.shortcut b { font-weight: 500; }
.shortcut:hover, .op:hover { background: var(--accent); }
.op { align-items: center; padding: 6px 8px; }
.op .lin { display: flex; align-items: center; gap: 8px; }
.ops.two { display: grid; grid-template-columns: 1fr 1fr; }
.am { display: inline-block; flex: none; width: 14px; height: 14px; border-radius: 4px; border: 1px solid var(--border); }
.themes { display: flex; flex-direction: column; gap: 14px; }

/* the map: canvas with a dot grid that follows zoom and pan */
.stage { flex: 1 1 0; min-height: 0; position: relative; overflow: hidden; --sh: 38px; }
#svg:focus { outline: none; }
#svg:focus-visible { outline: 2px solid var(--ring); outline-offset: -2px; }
/* a click also focuses: while the last interaction was a pointer, no browser focus ring on the map, its nodes or the sheet */
[data-pointer-focus] #svg, [data-pointer-focus] #svg *, [data-pointer-focus] .stage, [data-pointer-focus] .sheet { outline: none !important; }
[data-pointer-focus] .n:focus-visible:not(.self) .ring { display: none; }
.stage, .sheet { outline: none; }
#svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; font-family: var(--body); touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
.stage.pan #svg { cursor: grabbing; }
#dots circle { fill: var(--canvas-dot); }
.grid { fill: url(#dots); stroke: none; pointer-events: none; }
.n { cursor: pointer; transition: opacity 0.12s; outline: none; }
.n .box { fill: var(--cat, var(--muted)); stroke: none; }
/* while the nodes slide to a new layout, the links (already at their new place) fade in */
@keyframes settle { from { opacity: 0; } }
.settling .e, .settling .q { animation: settle 200ms ease-out; }
@media (prefers-reduced-motion: reduce) { .settling .e, .settling .q { animation: none; } }
.n .disc { fill: var(--card); stroke: var(--border); stroke-width: 1; vector-effect: non-scaling-stroke; }
.n .hit { fill: transparent; stroke: none; }
.n text { fill: var(--foreground); font-size: var(--nf, 12.5px); font-weight: 500; pointer-events: none; }
/* a good's name carries a halo in the canvas color, so a link passing behind it disappears instead of striking it through */
.n.g text { paint-order: stroke; stroke: var(--canvas); stroke-width: 5px; stroke-linejoin: round; }
.n.b text { fill: #ffffff; font-weight: 600; }
.n.b.lock .box { fill-opacity: 0.45; }
.n.b.lock text { fill: var(--foreground); }
.n.b.off .box { fill: var(--muted); fill-opacity: 1; }
.n.b.off text { fill: var(--foreground); opacity: 0.8; }
/* the ring is state: pinned node and keyboard focus */
.n .ring { fill: none; stroke: var(--primary); stroke-width: 2; vector-effect: non-scaling-stroke; display: none; }
.n.self .ring, .n:focus-visible .ring { display: block; }
/* a pinned good becomes a block for as long as it is pinned: opaque plate behind icon and name, name in the weight of a building */
.n .plate { fill: var(--card); stroke: var(--border); stroke-width: 1; vector-effect: non-scaling-stroke; display: none; }
.n.g.self .plate { display: block; }
.n.g.self text { font-weight: 600; stroke: var(--card); }
.n.g.self .disc { fill: var(--muted); }
.e { fill: none; stroke: var(--link); stroke-width: 1; vector-effect: non-scaling-stroke; transition: opacity 0.12s; }
.e.fut { stroke-dasharray: 6 5; }
.e.up { stroke: var(--in); }
.e.dn { stroke: var(--out); }
.e.w1 { stroke-width: 3; }
.e.w2 { stroke-width: 2; }
.e.w3 { stroke-width: 1.3; }
.q { display: none; fill: var(--foreground); font-family: var(--mono); font-size: var(--qf, 11px); font-weight: 500; paint-order: stroke; stroke: var(--canvas); stroke-width: 3.5px; stroke-linejoin: round; pointer-events: none; }
.lod-near .q, .q.hv { display: block; }
.q.up { fill: var(--in); }
.q.dn { fill: var(--out); }
#arr path { fill: var(--link); }
#arru path { fill: var(--in); }
#arrd path { fill: var(--out); }
#svg.hov .e:not(.hv) { opacity: 0.25; }
#svg.hov .q:not(.hv) { opacity: 0.25; }
#svg.hov .n:not(.hv) { opacity: 0.25; }

.tip { position: absolute; z-index: 7; pointer-events: none; max-width: 340px; background: var(--popover); color: var(--foreground); border: 1px solid var(--border); border-radius: 8px; box-shadow: var(--shadow); padding: 8px 10px; font-size: 12px; line-height: 1.35; }
.tip b { font-weight: 600; font-size: 13px; }
.tip .r { margin-top: 5px; }
.tip .hd { display: flex; align-items: center; gap: 7px; }
.tip img.ic { width: 22px; height: 22px; }

.float { position: absolute; z-index: 3; bottom: calc(var(--sh) + 12px); }
.zoom { right: 12px; display: inline-flex; border: 1px solid var(--border); border-radius: 8px; background: var(--background); box-shadow: var(--shadow); overflow: hidden; }
.zoom button { display: inline-flex; align-items: center; background: none; border: 0; border-left: 1px solid var(--border); height: 32px; padding: 0 11px; color: var(--foreground); }
.zoom button:first-child { border-left: 0; }
.zoom button:hover { background: var(--accent); }
.legend { left: 12px; font-size: 12px; color: var(--muted-foreground); background: var(--popover); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow); max-width: min(360px, calc(100% - 170px)); max-height: calc(100% - var(--sh) - 30px); overflow-y: auto; }
.legend summary { cursor: pointer; padding: 7px 12px 7px 8px; color: var(--foreground); font-weight: 500; list-style: none; display: flex; align-items: center; gap: 4px; border-radius: 10px; }
.legend summary::-webkit-details-marker { display: none; }
.legend summary .ico { width: 15px; height: 15px; transition: transform 0.12s; }
.legend[open] summary .ico { transform: rotate(90deg); }
.legend summary:hover { background: var(--accent); }
.legend .items { display: flex; flex-direction: column; gap: 5px; padding: 2px 12px 10px; }
.legend .items > span { display: flex; align-items: center; gap: 8px; }
.legend .categories { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; padding: 8px 12px 10px; border-top: 1px solid var(--border); }
.legend .categories span { display: flex; align-items: center; gap: 6px; }
.lg { display: inline-block; flex: none; width: 24px; height: 12px; border-radius: 4px; }
.lg.bld { background: #7c3aed; }
.lg.lock { background: #7c3aed; opacity: 0.45; }
.lg.good { width: 14px; height: 14px; margin: 0 5px; border-radius: 50%; background: var(--card); border: 1px solid var(--border); }
svg.lgl { flex: none; }
svg.lgl line { stroke: var(--link); stroke-width: 1.5; }
svg.lgl.fut line { stroke-dasharray: 5 4; }
svg.lgl.up line { stroke: var(--in); stroke-width: 3; }
svg.lgl.dn line { stroke: var(--out); stroke-width: 3; }
/* technology dot: filled = within your era, faint = beyond it */
.pt { display: inline-block; flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--border); margin-right: 6px; }
.pt.on { background: var(--muted-foreground); }

/* the sheet */
.sheet { position: absolute; z-index: 5; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--border); border-radius: 10px 10px 0 0; box-shadow: 0 -4px 12px -6px rgb(0 0 0 / 0.12); display: flex; flex-direction: column; max-height: calc(100% - 40px); }
.sheet:not(.pinned) { border-radius: 0; }
.grip { flex: none; height: 12px; cursor: ns-resize; touch-action: none; display: flex; align-items: center; justify-content: center; }
.grip::before { content: ""; width: 40px; height: 4px; border-radius: 2px; background: var(--border); }
.grip:hover::before, .grip:focus-visible::before { background: var(--muted-foreground); }
.sh-head { flex: none; display: flex; flex-wrap: nowrap; align-items: center; gap: 4px; padding: 0 10px 8px 14px; min-width: 0; }
.sheet:not(.pinned) .sh-head { padding: 8px 14px; min-height: 38px; gap: 12px; }
.sh-head .ttl { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1 1 0; }
.sh-head .ttl img.ic { width: 28px; height: 28px; }
.sh-head .ttl h2 { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 0 1 auto; }
.sh-head .cat { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted-foreground); white-space: nowrap; min-width: 0; overflow: hidden; text-overflow: ellipsis; flex: 0 20 auto; }
.sh-head .cat .sw { flex: none; }
.sh-head .st { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1 1 0; text-align: right; }
.sh-head .hint { flex: 0 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; font-size: 13px; }
.ttl h2.off { color: var(--muted-foreground); }
.ttl .excluded-badge { font-size: 12px; color: var(--muted-foreground); white-space: nowrap; }
.eye[aria-pressed="false"] { color: var(--muted-foreground); }
.tec { display: inline-flex; align-items: center; font-size: 12px; color: var(--muted-foreground); white-space: nowrap; }
@media (max-width: 759px) { .sh-head .cat.for-good { display: none; } }
.sh-body { flex: 1 1 auto; min-height: 0; overflow: auto; border-top: 1px solid var(--border); font-size: 13px; }

/* the table: the same tracks on every row; hairlines between rows; the row under the mouse takes the accent fill */
.tb { display: grid; grid-template-columns: 38px minmax(210px, 30%) fit-content(36%) 46px minmax(0, 1fr); align-items: stretch; }
.tb.for-good { grid-template-columns: 38px minmax(210px, 36%) minmax(90px, max-content) 46px minmax(0, 1fr); }
.tr { display: contents; cursor: default; }
label.tr { cursor: pointer; }
.tb .th, .tr > div { padding: 7px 8px; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 1px; border-bottom: 1px solid var(--border); }
.tr:hover > div { background: var(--accent); }
.tb .th { position: sticky; top: 0; z-index: 1; background: var(--card); font-size: 12px; font-weight: 500; color: var(--muted-foreground); flex-direction: row; justify-content: flex-start; align-items: baseline; gap: 10px; }
.tb .th .sm { font-weight: 400; }
.tb .c-mk { align-items: center; padding-right: 0; padding-left: 14px; }
.tr > .c-nm { align-items: flex-start; }
.tb .c-ar { align-items: center; padding-inline: 0; color: var(--muted-foreground); }
.tr.tot > div { background: var(--muted); padding-block: 8px; }
/* the column header and the total stay at the top while the groups scroll under them (not when that block would take
   too much of the sheet, nor on a phone, where each row is a stacked block) */
.tb.stick .tr.tot > div { position: sticky; top: var(--thh, 30px); z-index: 1; }
/* a method group: one row with what is ticked in it; clicking it opens the list of its methods in place */
.tr.grow { cursor: pointer; }
.tr.grow > div { padding-block: 7px; }
.tr.grow .gn { font-weight: 600; letter-spacing: -0.01em; }
.tr.grow .sum { color: var(--muted-foreground); }
.tr.grow .sum .mn { color: var(--foreground); }

.grp-body { display: contents; }
.grp-body .tr > div { background: color-mix(in srgb, var(--muted) 45%, var(--card)); }

.tb .c-mk { padding-left: 10px; }
.tb .gh .gn { font-weight: 600; letter-spacing: -0.01em; }
.tb .empty { grid-column: 3 / -1; }
.mn { font-weight: 500; }
.note { font-size: 12px; color: var(--muted-foreground); }
.warn { font-size: 12px; font-weight: 600; }
.nx { font-size: 12px; color: var(--muted-foreground); }
.us { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 14px; min-width: 0; }
.un { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; color: var(--foreground); font-weight: 400; }

    if (ev.key === 'Escape') { resultsBox.hidden = true; searchInput.blur(); ev.stopPropagation(); return; }
    if (ev.key === 'ArrowDown') { var p = resultsBox.querySelector('button'); if (p) { ev.preventDefault(); p.focus(); } return; }
    if (ev.key !== 'Enter') return;
    var action = search(); if (action.length) { searchInput.value = ''; resultsBox.hidden = true; searchInput.blur(); pinNode(action[0].id); }
  });
  resultsBox.addEventListener('keydown', function (ev) {
    if (ev.key !== 'ArrowDown' && ev.key !== 'ArrowUp') return;
    ev.preventDefault();
    var target = ev.key === 'ArrowDown' ? ev.target.nextElementSibling : ev.target.previousElementSibling;
    (target || searchInput).focus();
  });

  // where the focus came from: a pointer press marks it, the next key clears it (the map only shows a ring for the keyboard)
  document.addEventListener('pointerdown', function () { document.documentElement.setAttribute('data-pointer-focus', ''); }, true);
  document.addEventListener('keydown', function () { document.documentElement.removeAttribute('data-pointer-focus'); }, true);
  // menus: arrow down (or Enter / space, which click) opens from the trigger; arrows, Home and End walk the items; Esc closes
  document.addEventListener('keydown', function (ev) {
    if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
    var trigger = null;
    MENUS.forEach(function (x) { if (ev.target.id === x[1]) trigger = x; });
    if (trigger && (ev.key === 'ArrowDown' || ev.key === 'Enter' || ev.key === ' ')) { ev.preventDefault(); openMenu(trigger[0], true); return; }
    if (!openMenuEntry) return;
    var p = $(openMenuEntry[0]);
    if (!p.contains(ev.target)) return;
    var it = menuItems(p), i = it.indexOf(ev.target), n = null;
    if (ev.key === 'ArrowDown') n = it[(i + 1) % it.length];
    else if (ev.key === 'ArrowUp') n = it[(i - 1 + it.length) % it.length];
    else if (ev.key === 'Home') n = it[0];
    else if (ev.key === 'End') n = it[it.length - 1];
    if (n) { ev.preventDefault(); n.focus(); }
  });
  // the map itself, focused from the keyboard: arrows move it
  svg.addEventListener('keydown', function (ev) {
    if (ev.target !== svg) return;
    var d = { ArrowLeft: [60, 0], ArrowRight: [-60, 0], ArrowUp: [0, 60], ArrowDown: [0, -60] }[ev.key];
    if (!d) return;
    ev.preventDefault(); cameraMoved = true; view.x += d[0]; view.y += d[1]; applyView();
  });

  // keyboard shortcuts
  document.addEventListener('keydown', function (ev) {
    if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
    var x = ev.target, typing = x && (x.tagName === 'INPUT' && x.type !== 'checkbox' || x.tagName === 'SELECT' || x.tagName === 'TEXTAREA');
    if (ev.key === 'Escape') {
      if (menuIsOpen()) { closeMenu(); return; }
      if (typing) { x.blur(); return; }
      // Esc closes an open method group first, then releases the node
      if (pinned && openGroup !== null && pinned[0] === 'b' && BUILDINGS[pinned.slice(2)].groups.length > 1) { openGroup = null; renderSheet(); renderControls(); renderStatus(); return; }
      if (pinned) pinNode(null);
      return;
    }
    if (typing) return;
    if (ev.key === '/') { ev.preventDefault(); searchInput.focus(); }
    else if (ev.key === '0') fit();
    else if (ev.key === '+' || ev.key === '=') zoomAtCenter(1.3);
    else if (ev.key === '-' || ev.key === '−') zoomAtCenter(1 / 1.3);
    else if (pinned && !menuIsOpen()) {
      // chain of the pinned node: reach with brackets (or comma and period, kinder to some keyboards), direction and isolate with letters
      var k = ev.key.length === 1 ? ev.key.toLowerCase() : ev.key;
      if (k === '}' || k === '>' || (ev.shiftKey && (k === ']' || k === '.'))) setReach('max');
      else if (k === '{' || k === '<' || (ev.shiftKey && (k === '[' || k === ','))) setReach('one');
      else if (k === ']' || k === '.') setReach('further');
      else if (k === '[' || k === ',') setReach('closer');
      else if (k === 'u') setDirection('upstream');
      else if (k === 'b') setDirection('both');
      else if (k === 'd') setDirection('downstream');
      else if (k === 'i') toggleIsolated();
      else return;
      ev.preventDefault();
    }
  });

  // The map area changes size (window resized, phone rotated, the chain strip appearing). While the camera was not
  // moved by hand, fit again; if it was, keep the zoom and keep the same point of the graph at the center.
  // The sheet lives inside the map area and does not resize it, so fitting can never feed back into this observer.
  var stageSize = { w: stage.clientWidth, h: stage.clientHeight }, resizeTimer = null;
  function refitIfAuto() { if (!cameraMoved) { fit(); if (pinned && !isolated) frameChain(); } }
  function onResize() {
    var w = stage.clientWidth, h = stage.clientHeight;
    if (!w || !h || (w === stageSize.w && h === stageSize.h)) return;
    applySheetHeight();
    if (cameraMoved) {
      view.x += (w - stageSize.w) / 2; view.y += (h - stageSize.h) / 2;
      applyView();
    } else { fit(); if (pinned && !isolated) frameChain(); }
    stageSize = { w: w, h: h };
  }
  var schedule = function () { clearTimeout(resizeTimer); resizeTimer = setTimeout(onResize, 120); };
  if (window.ResizeObserver) new ResizeObserver(schedule).observe(stage);
  window.addEventListener('resize', schedule); // also covers browsers that deliver the observer late
  window.addEventListener('orientationchange', schedule);

  loadState();
  applyTheme();
  setLanguage(initialLanguage());
  recalculate();
  renderAll(true);
  stageSize = { w: stage.clientWidth, h: stage.clientHeight };
})();
</script>
